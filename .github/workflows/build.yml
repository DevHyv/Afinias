name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-temurin

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libffi-dev \
          libssl-dev \
          python3-dev \
          python3-pip \
          git \
          cython
    
    - name: Create Android SDK directories
      run: |
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        mkdir -p ~/.buildozer/android/platform/android-ndk
    
    - name: Accept SDK Licenses
      run: |
        mkdir -p ~/.android
        echo -e "\n8933bad161af4d5d5f76d7fc9a90cad7" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "\nd975f751696ccc14760859f7f64f5e96" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
        echo -e "\nec53b95b94c8425d29f32fa855ead4de" > ~/.buildozer/android/platform/android-sdk/licenses/android-google-play-services-license
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip wheel
        pip install -r requirements.txt
    
    - name: Cache .buildozer
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'requirements.txt') }}
        restore-keys: |
          buildozer-${{ runner.os }}-
    
    - name: Build APK
      run: |
        buildozer android release 2>&1 | tee build.log
      timeout-minutes: 90
    
    - name: Check build status
      run: |
        if [ -f "bin/afinia-1.0.0-release-unsigned.apk" ]; then
          echo "✓ APK built successfully!"
          ls -lh bin/afinia-1.0.0-release-unsigned.apk
        else
          echo "✗ APK build failed"
          tail -100 build.log
          exit 1
        fi
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: afinia-apk
        path: bin/afinia-1.0.0-release-unsigned.apk
        retention-days: 30
    
    - name: Upload build log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-log
        path: build.log
        retention-days: 7
